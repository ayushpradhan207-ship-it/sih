<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col selection:bg-secondary selection:text-white pb-20 md:pb-0">

  <!-- TOP APP BAR -->
  <header id="navbar-root"></header>

  <!-- MAIN APP CONTAINER -->
  <main id="app-root" class="flex-1"></main>

  <!-- BOTTOM NAVIGATION BAR (Mobile & Tablet) -->
  <nav id="bottomnav-root"></nav>

  <!-- GLOBAL MODAL CONTAINER & SYSTEM MODALS -->
  <div id="modal-root">
    <!-- BRIDGE GAP / LEARNING PATH MODAL -->
    <div id="bridge-gap-modal" class="hidden fixed inset-0 z-[9990] bg-black/40 backdrop-blur-sm items-center justify-center p-4" onclick="if(event.target===this)Utils.closeModal('bridge-gap-modal')">
      <div class="bg-surface-container-lowest rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-surface-variant/40">
        <div id="bridge-gap-modal-content" class="p-6"></div>
      </div>
    </div>

    <!-- SKILL DETAIL MODAL -->
    <div id="skill-detail-modal" class="hidden fixed inset-0 z-[9990] bg-black/40 backdrop-blur-sm items-center justify-center p-4" onclick="if(event.target===this)Utils.closeModal('skill-detail-modal')">
      <div class="bg-surface-container-lowest rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-surface-variant/40">
        <div id="skill-detail-modal-content" class="p-6"></div>
      </div>
    </div>

    <!-- RECRUITER EXPLANATION MODAL -->
    <div id="recruiter-explanation-modal" class="hidden fixed inset-0 z-[9990] bg-black/40 backdrop-blur-sm items-center justify-center p-4" onclick="if(event.target===this)Utils.closeModal('recruiter-explanation-modal')">
      <div class="bg-surface-container-lowest rounded-3xl shadow-2xl w-full max-w-xl overflow-hidden border border-surface-variant/40">
        <div id="recruiter-explanation-content" class="p-6"></div>
      </div>
    </div>

    <!-- AUTH MODAL OVERLAY -->
    <div id="auth-modal" class="hidden fixed inset-0 z-[9995] bg-black/50 backdrop-blur-sm items-center justify-center p-4" onclick="if(event.target===this)Utils.closeModal('auth-modal')">
      <div class="bg-surface-container-lowest rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-surface-variant/40">
        <div id="auth-modal-content" class="p-6"></div>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  <!-- FOOTER ROOT -->
  <div id="footer-root"></div>
