[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veriskill"
version = "0.1.0"
description = "VeriSkill AI/ML Engine: Verified skill extraction, explainable matching, team optimization, and fairness auditing."
readme = "README.md"
authors = [{ name = "VeriSkill Engineering Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["skills", "verification", "matching", "fairness", "explainable-ai", "team-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
veriskill = "veriskill.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["veriskill*"]
